services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catequese
      POSTGRES_PASSWORD: catequese
      POSTGRES_DB: catequese_sjo
    ports:
      - "5432:5432"
    volumes:
      - catequese_db_data:/var/lib/postgresql/data

volumes:
  catequese_db_data:
